<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linode API</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="images/icons/css/font-awesome.css">
    <link href="http://fonts.googleapis.com/css?family=Open+Sans:400,600" rel="stylesheet">
    <script src="scripts/jquery-1.9.1.min.js"></script>
    <script src="bootstrap/js/bootstrap.min.js"></script>
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f4f6f8; /* Softer light background */
            color: #2c3e50; /* Darker text for better readability */
            line-height: 1.6; 
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); /* Slightly smaller shadow */
            padding: 40px;
            margin: 20px auto;
            max-width: 80%;
        }
        
        h2 {
            color: #34495e; /* Darker blue-gray for headings */
            margin-bottom: 30px;
            font-weight: 600;
            text-align: center;
        }
        
        .form-inline {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .form-inline input,
        .form-inline select {
            flex: 1;
            margin-right: 10px;
            border: 1px solid #bdc3c7; /* Softer gray borders */
            border-radius: 4px;
            padding: 10px;
            transition: border-color 0.3s ease;
        }
        
        .form-inline input:focus,
        .form-inline select:focus {
            border-color: #3498db; /* Bright blue focus for input fields */
            outline: none;
        }
        
        .btn {
            border-radius: 4px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .btn-success {
            background-color: #27ae60; /* Softer green */
            border: none;
        }
        
        .btn-success:hover {
            background-color: #229954; /* Slightly darker hover effect */
        }
        
        .btn-primary {
            background-color: #2980b9; /* Strong blue for primary buttons */
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #2471a3; /* Darker blue on hover */
        }
        
        .btn-info {
            background-color: #16a085; /* Teal color for info buttons */
            border: none;
        }
        
        .btn-info:hover {
            background-color: #138d75;
        }
        
        .table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .table th,
        .table td {
            vertical-align: middle;
            text-align: center;
            padding: 12px;
            border: 1px solid #ecf0f1; /* Light borders for better separation */
        }
        
        .table th {
            background-color: #f2f3f5; /* Soft gray background for headers */
            color: #34495e; /* Darker text for contrast */
            font-weight: 600;
        }
        
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f9f9f9; /* Light row background for stripes */
        }
        
        .table-hover tbody tr:hover {
            background-color: #eaf2f8; /* Soft blue for hover effect */
        }
        
        .modal-header {
            border-bottom: 2px solid #2980b9; /* Consistent blue for modal header */
        }
        
        .modal-body {
            font-size: 16px;
        }
        
        .text-center {
            margin-top: 20px;
        }
        
        .textarea {
            border-radius: 4px;
            border: 1px solid #bdc3c7;
            padding: 10px;
            width: 100%;
            resize: none;
        }
        
        .textarea:focus {
            border-color: #2980b9;
            outline: none;
        }
        
        @media (max-width: 600px) {
            .form-inline {
                flex-direction: column;
            }
            .form-inline input,
            .form-inline select {
                margin-right: 0;
                margin-bottom: 10px;
            }
        }
        
        
        
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center">Linode API</h2>
        <form class="form-inline mb-4">
            <input required name="api" class="form-control" placeholder="API Key" type="text">
            <button name="action" value="api" class="btn btn-success" type="submit"><i class="icon-play icon-white"></i> Make Change</button>
        </form>

        <div class="form-group">
            <label for="region" class="control-label"><b>Create Linode</b></label>
            <select class="form-control" id="region" name="region">
                <option value="ap-west">Mumbai</option>
                <option value="ca-central">Toronto</option>
                <option value="ap-southeast">Sydney</option>
                <option value="us-iad">Washington</option>
                <option value="us-ord">Chicago</option>
                <option value="fr-par">Paris</option>
                <option value="us-sea">Seattle</option>
                <option value="br-gru">Sao Paulo</option>
                <option value="nl-ams">Amsterdam</option>
                <option value="se-sto">Stockholm</option>
                <option value="in-maa">Chennai</option>
                <option value="jp-osa">Osaka</option>
                <option value="it-mil">Milan</option>
                <option value="us-mia">Miami</option>
                <option value="id-cgk">Jakarta</option>
                <option value="us-lax">Los Angeles</option>
                <option value="us-central">Dallas</option>
                <option value="us-west">Fremont</option>
                <option value="us-southeast">Atlanta</option>
                <option value="us-east">Newark</option>
                <option value="eu-west">London</option>
                <option value="ap-south">Singapore</option>
                <option value="eu-central">Frankfurt</option>
                <option style="color:green;" value="random">Random</option>
            </select>
            <input required name="domain" class="form-control" placeholder="Label" style="width: 130px;" type="text">
            <input required name="number" class="form-control" placeholder="number" min="1" type="number" style="width: 60px;">
            <button class="btn btn-primary" name="action" value="create" type="submit"><i class="icon-bookmark icon-pencil icon-white"></i> Create</button>
            <button class="btn btn-info" type="button" onclick="copy()"><i class="icon-copy icon-white"></i> Copy IPs</button>
        </div>

        <div class="table-responsive mt-4">
            <table id="show" class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th><input type="checkbox"></th>
                        <th>IP</th>
                        <th>Abusix</th>
                        <th>Region</th>
                        <th>RDNS</th>
                        <th>Status</th>
                        <th>Label</th>
                        <th>Destroy</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>172.105.7.212</td>
                        <td>ok</td>
                        <td>Toronto, CA</td>
                        <td><a href="rdns.php?ip=172.105.7.212">lffdzax.iceage.com.my</a></td>
                        <td>running</td>
                        <td>ToRo-YS_0</td>
                        <td><a style="color:red;" href="?action=delete&id=61220170">Delete</a></td>
                    </tr>
                    <!-- add tr rows with js -->
                </tbody>
                <tfoot>
                    <tr>
                        <th><button type="button" class="btn btn-danger">X</button></th>
                        <th>IP</th>
                        <th><button type="button" class="btn btn-warning">Check</button><button type="button" class="btn btn-danger">Clean</button></th>
                        <th>Region</th>
                        <th>RDNS</th>
                        <th>Status</th>
                        <th>Label</th>
                        <th>Destroy</th>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="text-center mt-4">
            <textarea class="form-control" rows="5" placeholder="Additional notes..."></textarea>
            <br>
            <button type="button" class="btn btn-primary">Select</button>
            <button type="button" class="btn btn-secondary">Check Score</button>
        </div>
    </div>


    
</body>
<script></script>
</html>
